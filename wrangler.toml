# ═══════════════════════════════════════════════════════════════════════════
#  wrangler.toml — Suman Dangal · Cloudflare Pages (advanced mode)
#
#  Because this file sets pages_build_output_dir, it is the source of truth
#  for the project's plain variables: the dashboard shows them read-only.
#  SECRETS are not in this file — set them in the dashboard (Settings →
#  Variables and Secrets → type "Secret") or with:
#      npx wrangler pages secret put <NAME> --project-name portfolio
#
#  Secrets used by the worker:
#    SHEET_ID                 "Publish to web" ID (between /d/e/ and /pub)
#    CMS_APPS_SCRIPT_URL      Apps Script web-app URL used by the CMS
#    CMS_APPS_SCRIPT_SECRET   shared secret checked by the Apps Script
#    CMS_USERNAME             } create all three with:
#    CMS_PASSWORD_HASH        }   node tools/make-cms-secrets.mjs <username>
#    CMS_SESSION_SECRET       }
#  Local development: copy .dev.vars.example to .dev.vars (git-ignored).
# ═══════════════════════════════════════════════════════════════════════════

# Must match the Pages project name (portfolio → portfolio-1e6.pages.dev)
name               = "portfolio"
compatibility_date = "2024-09-23"

# Only public/ is uploaded. Worker source (worker/), notes, tests and
# reference copies live outside it and can never be served.
pages_build_output_dir = "./public"

[vars]
# Google Sheets — tab GIDs are not secrets (useless without SHEET_ID)
SHEET_BASE   = "https://docs.google.com/spreadsheets/d/e"
BLOG_GID     = "1132024800"
SKILLS_GID   = "302402061"
PROJECTS_GID = "0"
EXP_GID      = "245982630"
ABOUT_GID    = "1066410604"
FAQ_GID      = "303688554"
IMAGES_GID   = "1267436347"
FEATURED_GID = "980532084"
SITE_GID     = "1953062973"   # Site tab: Key | Value — every one-off text

# IndexNow (Bing, Yandex, Naver, Seznam, Yep). NOT a secret: search engines
# download it from https://suman-dangal.com.np/<key>.txt to verify submissions.
# To rotate it, replace with any 32 hex characters and notify again.
INDEXNOW_KEY = "3b9e9c19eba66dcbd80bc8a0a09274f8"
